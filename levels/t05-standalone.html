<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27><text y=%2713%27 font-size=%2713%27>🏁</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>第五關 綜合障礙賽（單飛考核）｜newdrone T05</title>
<script type="importmap">
{ "imports": { "three": "../vendor/three-0.184.0/three.module.min.js" } }
</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f19;
    font-family:'Share Tech Mono','Consolas',monospace;}
  #c{width:100%;height:100%;display:block;touch-action:none;}
  body.nd-portrait #c{height:60%;}
  #ver{position:fixed;left:10px;bottom:4px;font-size:10px;color:#3b5c7a;z-index:21;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ver">NEWDRONE T05 STANDALONE v1.0</div>
<script type="module">
import * as THREE from 'three';
import { Engine } from '../core/engine.js';
import { InputManager } from '../core/input.js';
import { Drone } from '../core/physics.js';
import { CameraRig, CAM_LABELS } from '../core/camera.js';
import { HUD, DENSITY_LABELS } from '../core/hud.js';
import { UI } from '../core/ui.js';
import { Guide } from '../core/guide.js';
import { buildBasicField, makeRing } from '../core/world.js';
import { buildDroneStyle, droneStyleGet, droneStyleSet, DRONE_STYLES } from '../core/drone-styles.js';
import { BatterySystem } from '../core/systems/battery.js';
import { checkRingPass } from '../core/systems/scoring.js';
import { sfx } from '../core/audio.js';
import { progress } from '../data/progress.js';
import { getLevel } from '../data/levels-manifest.js';

const LEVEL=getLevel('t05');
progress.migrateLegacy();

/* ── t05 是 A 部分訓練的最終驗收：不再分段教學（沒有 Guide 多步驟狀態機），
   而是像 sandbox 一樣「一次連續飛行」，把 t02-t04 學過的元素全部整合在同一趟
   航程裡——依序穿過 6 個檢查點、同時閃避障礙柱與巡邏無人機、電量持續消耗記得
   充電。沿用 template.html（sandbox）的「連續課程」結構，而非 t02/t03/t04
   的「分階段狀態機」結構，因為這關本質上就是一趟不中斷的飛行，沒有分階段
   切換，也就不會踩到 t04 那種「enterStage() 還沒跑完」的第一幀空窗期問題。 ── */
const lowQ=innerWidth<600;
const engine=new Engine(document.getElementById('c'),{lowQuality:lowQ});
const input=new InputManager();
const hud=new HUD(LEVEL.hud);
const ui=new UI(input);
const rig=new CameraRig(engine.camera,{pilotPositions:[
  new THREE.Vector3(16,7,14), new THREE.Vector3(-16,7,14), new THREE.Vector3(0,7,20)]});
/* 最遠檢查點 z=-45，留 5 裕度 → BOUND=50（沿用 t04 教訓：BOUND 一定要包住
   最遠目標並留出「飛過去」的裕度，不能只包到座標本身）。 */
const BOUND=50, HOVER_Y=4.0;
buildBasicField(engine.scene,{size:BOUND,sky:0x0b0f19});

/* ── 機體（樣式可在開場畫面切換，見 showIntro 的 b-style 按鈕）── */
const teamTint=progress.setting('teamTint',0x3399ff);
let styleIdx=Math.max(0,DRONE_STYLES.findIndex(s=>s.code===(droneStyleGet()||'trainer-orb')));
let mesh=null;
function rebuildMesh(){
  if(mesh)engine.scene.remove(mesh);
  mesh=buildDroneStyle(DRONE_STYLES[styleIdx].code,{tint:teamTint});
  mesh.castShadow=true;
  engine.scene.add(mesh);
}
rebuildMesh();

const SPAWN=new THREE.Vector3(0,1.5,5);   // 地面出生（不是懸停狀態，同 t04）
const drone=new Drone({mode:'arcade',bounds:{x:BOUND,z:BOUND,y:12},spawn:SPAWN});
const prevPos=new THREE.Vector3().copy(drone.pos);

/* ── 檢查點（依序穿過，順序不可跳過——沿用基本版 stage5 的「一次只判定當前那一個」）── */
const CHECKPOINT_POS=[
  new THREE.Vector3(0,HOVER_Y,-5),
  new THREE.Vector3(3,HOVER_Y+0.8,-13),
  new THREE.Vector3(-3,HOVER_Y-0.5,-21),
  new THREE.Vector3(2,HOVER_Y+1.2,-29),
  new THREE.Vector3(-2,HOVER_Y,-37),
  new THREE.Vector3(0,HOVER_Y+0.6,-45),
];
const checkpoints=CHECKPOINT_POS.map((p,i)=>{
  const r=makeRing(p,{radius:2.0,color:i===0?0x22c55e:0x64748b});
  engine.scene.add(r); return r;
});
function paintRing(r,hex,op){ r.children[0].material.color.setHex(hex);
  r.children[1].material.color.setHex(hex); r.children[0].material.opacity=op??0.75; }
let checkpointIndex=0;

/* ── 障礙柱（撞到累計次數＋推開衝量，不扣durability——這關重點是「熟練通過」
   不是「代價教學」，代價教學已在 t04 做過，這裡沿用基本版 stage5 的設計：
   只計次不強制失敗，鼓勵學生一次連續飛完全程）── */
const OBSTACLE_POS=[new THREE.Vector3(-2.5,HOVER_Y,-17), new THREE.Vector3(2.5,HOVER_Y,-33)];
const obstacleM=new THREE.MeshStandardMaterial({color:0x64748b,roughness:.6,emissive:0x334155,emissiveIntensity:.3});
const obstacleG=new THREE.CylinderGeometry(1,1,7,12);
const obstacles=OBSTACLE_POS.map(p=>{
  const m=new THREE.Mesh(obstacleG,obstacleM); m.position.copy(p); m.castShadow=!lowQ;
  engine.scene.add(m); return m;
});
let invulnTObstacle=0, obstacleHits=0;

/* ── 充電站＋電池（持續消耗，歸零不強制中斷比賽，讓學生體會後果並繼續嘗試，
   沿用基本版 stage5 的設計——跟 t04 crash 階段「歸零就迫降失敗」不同，這關
   電量只是持續壓力，不是硬性擋關條件） ── */
const chargerPos=new THREE.Vector3(0,0.3,-25);
const charger=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.4,0.4,20),
  new THREE.MeshStandardMaterial({color:0x1e293b,emissive:0xeab308,emissiveIntensity:.6,metalness:.7}));
charger.position.copy(chargerPos); engine.scene.add(charger);
const battery=new BatterySystem({start:100,drainPerSec:1.5*progress.classDiffCoef(),chargers:[{pos:chargerPos,radius:2.6,rate:30}]}); // 2026-08-02：班級難度倍率，無設定＝1.0、行為不變

/* ── 巡邏無人機（純視覺＋碰撞判定，非 Drone 物理，直接沿用基本版 stage5 的
   waypoint 來回巡邏邏輯——這不是 core/systems/ai.js 的足球 AI（那套需要
   soccer.js 的 FIELD/隊伍資料，跟這裡的「定點巡邏」語意不同），簡單 lerp
   來回移動即可，不需要另外發明或硬套一套不合用的系統） ── */
function buildAIDrone(color,waypoints){
  const group=new THREE.Group();
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.45,12,12),
    new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:0.9,wireframe:true,transparent:true,opacity:0.85}));
  group.add(body);
  const beacon=new THREE.PointLight(color,0.8,3);
  group.add(beacon);
  group.position.copy(waypoints[0]);
  engine.scene.add(group);
  return { mesh:group, waypoints, segIndex:0, segT:0, speed:0.25 };
}
const aiDrones=[
  buildAIDrone(0xf97316,[new THREE.Vector3(-5,HOVER_Y-1,-10),new THREE.Vector3(5,HOVER_Y-1,-14),new THREE.Vector3(-5,HOVER_Y-1,-10)]),
  buildAIDrone(0xf97316,[new THREE.Vector3(4,HOVER_Y+1.5,-30),new THREE.Vector3(-4,HOVER_Y+1.5,-36),new THREE.Vector3(4,HOVER_Y+1.5,-30)]),
];
function updateAIDrones(dt){
  aiDrones.forEach(ai=>{
    const from=ai.waypoints[ai.segIndex], to=ai.waypoints[(ai.segIndex+1)%ai.waypoints.length];
    const dist=from.distanceTo(to);
    ai.segT+=(ai.speed*dt)/Math.max(dist,0.01);
    if(ai.segT>=1){ ai.segT=0; ai.segIndex=(ai.segIndex+1)%ai.waypoints.length; }
    const curFrom=ai.waypoints[ai.segIndex], curTo=ai.waypoints[(ai.segIndex+1)%ai.waypoints.length];
    ai.mesh.position.lerpVectors(curFrom,curTo,ai.segT);
  });
}
let invulnTAI=0, aiHits=0;

/* ── 引導（單步驟，主要負責 HUD 文字；真正的「下一個目標在哪」由
   hud.setOffscreenTarget 動態指向當前檢查點負責，跟 sandbox 同一套做法） ── */
const guide=new Guide([
  { text:'依序穿過 6 個檢查點，抵達終點', done:s=>s.checkpointIndex>=checkpoints.length },
],hud,engine.scene);

/* ── 飛行統計（供結算報告：飛行時間／高度穩定度／碰撞／擦身／完賽電量） ── */
let flightTime=0, altitudeDeviationSum=0, altitudeSampleCount=0, finished=false;

/* ── 視角／蹲姿 ── */
function cycleCam(){ hud.toast('視角：'+CAM_LABELS[rig.cycleMode()],'ok'); syncModes(); }
function syncModes(){ hud.setModes('街機',CAM_LABELS[rig.mode]); }
addEventListener('keydown',e=>{
  if(e.code==='KeyC')cycleCam();
  if(e.code==='KeyV'){rig.cyclePilot();
    if(rig.mode==='ground')hud.toast(`飛手站位 ${rig.pilotIdx+1}/${rig.pilotPositions.length}`,'ok');}
  if(e.code==='KeyZ')rig.crouch=true;
  if(e.code==='Escape')togglePause();
});
addEventListener('keyup',e=>{ if(e.code==='KeyZ')rig.crouch=false; });
hud.onCamButton(cycleCam);
hud.onPauseButton(togglePause);
hud.attachTouch(input);

/* ── Intro／暫停／結算 ── */
function showIntro(focusIdx=1){
  engine.simStarted=false;
  ui.showModal({
    title:'綜合障礙賽（單飛考核）',
    html:`<p>🏁 這是 A 部分訓練的最終驗收，把之前學過的技能整合在同一趟航程：</p>
      <p>🟢 依序穿過全部 6 個檢查點光環（順序固定，不能跳過）<br>
      🚧 閃避灰色障礙柱（撞到會計入碰撞次數，不會強制中斷）<br>
      🚁 留意橘色巡邏無人機，太靠近會計入擦身次數<br>
      🔋 電池持續消耗，記得去黃色充電站補充<br><br>
      完成後會產生一份完整飛行報告，記錄你的整體表現。</p>`,
    buttons:[
      {id:'b-style',label:'機體樣式：'+DRONE_STYLES[styleIdx].name,
        onClick:()=>{styleIdx=(styleIdx+1)%DRONE_STYLES.length;
          droneStyleSet(DRONE_STYLES[styleIdx].code);rebuildMesh();showIntro(0);}},
      {id:'b-go',label:'🚀 開始障礙賽',onClick:startGame}],align:'top'});
  ui.gpSetFocus(['b-style','b-go'],focusIdx);
}
function startGame(){
  ui.closeModal(); sfx.play('click');
  engine.simStarted=true;
  guide.start();
  hud.setOffscreenTarget(checkpoints[0].position);
  hud.toast('起飛！','ok');
}
function togglePause(){
  if(!engine.simStarted||finished)return;
  engine.paused=!engine.paused;
  if(engine.paused)showPauseModal(); else ui.closeModal();
}
function showPauseModal(){
  ui.showModal({title:'暫停',
    html:`<p>任務：${LEVEL.title}</p><p>已穿越 ${checkpointIndex}/${checkpoints.length}・已飛行 ${flightTime.toFixed(0)} 秒</p>`,
    buttons:[
      {id:'b-resume',label:'繼續',onClick:togglePause},
      {id:'b-density',label:'HUD：'+DENSITY_LABELS[hud.density],
        onClick:()=>{hud.cycleDensity();showPauseModal();}},
      {id:'b-audio',label:'音效：'+(sfx.enabled?'開':'關'),
        onClick:()=>{sfx.toggle();sfx.play('click');showPauseModal();}},
      {id:'b-restart',label:'重來',onClick:()=>location.reload()},
    ]});
}
function finishLevel(){
  if(finished)return;
  finished=true; sfx.play('finish');
  hud.setOffscreenTarget(null); hud.setGuide(null);
  const avgDeviation=altitudeSampleCount>0?(altitudeDeviationSum/altitudeSampleCount):0;
  const stabilityScore=Math.round(THREE.MathUtils.clamp(100-avgDeviation*20,0,100));
  const finalBattery=Math.round(battery.pct);
  /* 綜合分數：以高度穩定度為基底，碰撞／擦身各扣分——呼應 t06「windScore+stabilityScore
     取平均」的複合分數精神，這關則是「穩定度－碰撞代價」，反映「整趟飛完的整體表現」 */
  const score=Math.round(THREE.MathUtils.clamp(stabilityScore-obstacleHits*8-aiHits*4,0,100));
  progress.record('t05',{completed:true,score,
    metrics:{flightTime:Math.round(flightTime),stabilityScore,obstacleHits,aiHits,finalBattery}});
  ui.showModal({title:'🏆 綜合障礙賽 完成！',
    html:`<p>⏱ 飛行時間：${flightTime.toFixed(1)} 秒　📊 高度穩定度：${stabilityScore}/100</p>
      <p>💥 障礙碰撞：${obstacleHits} 次　🚁 無人機擦身：${aiHits} 次　🔋 完賽電量：${finalBattery}%</p>
      <p>🎉 恭喜完成 A 部分全部訓練！成績已記錄（nd.progress.t05）。</p>`,
    buttons:[
      {id:'b-retry',label:'再挑戰',onClick:()=>location.reload()},
      {id:'b-back',label:'返回入口',onClick:()=>location.href='../index.html'},
    ]});
}

/* ── HUD 初始 ── */
hud.setMission('綜合障礙賽：依序穿環・避開障礙與巡邏機');
hud.showAttitude(false);
syncModes();

/* ── 測試/除錯 hook ── */
window.ndDebug=()=>({checkpointIndex,total:checkpoints.length,obstacleHits,aiHits,
  batteryPct:battery.pct,dronePos:drone.pos.clone(),flightTime,finished});
window.ndTest={
  forceFinish:()=>{
    checkpoints.forEach(r=>r.userData.passed=true);
    checkpointIndex=checkpoints.length;
    finishLevel();
  },
  /* warp 到「檢查點前方一小段」而非直接判定成功，讓接下來一小段真實飛行
     仍要真的觸發 checkRingPass——同 t02/t03/t04 warp 系列的用意，避免
     測試捷徑掩蓋掉空間可達性問題 */
  warpBeforeCheckpoint:(i)=>{
    const r=checkpoints[i]; if(!r)return false;
    drone.pos.set(r.position.x,r.position.y,r.position.z+3);
    drone.vel.set(0,0,0);
    for(let k=0;k<i;k++)checkpoints[k].userData.passed=true;
    checkpointIndex=i;
    paintRing(checkpoints[i],0x22c55e);
    hud.setOffscreenTarget(checkpoints[i].position);
    return true;
  }
};

/* ── 主迴圈 ── */
engine.start((dt,simStarted)=>{
  input.update(dt); ui.update(dt);
  if(engine.paused)return;
  const p=input.player(0);
  hud.setGpBar(p.device);
  if(p.device==='gamepad'){
    const camE=p.fnEdge('camCycle'), pilotE=p.fnEdge('pilotCycle');
    rig.crouch=p.btn('crouch');
    if(simStarted&&!ui.modalOpen){
      if(camE)cycleCam();
      if(pilotE){rig.cyclePilot();
        if(rig.mode==='ground')hud.toast(`飛手站位 ${rig.pilotIdx+1}/${rig.pilotPositions.length}`,'ok');}
    }
  }
  if(simStarted&&!finished){
    flightTime+=dt;
    altitudeDeviationSum+=Math.abs(drone.pos.y-HOVER_Y); altitudeSampleCount++;
    prevPos.copy(drone.pos);
    drone.update(dt,p);
    battery.update(dt,drone.pos,true);
    if(battery.empty) drone.vel.y-=5.9*dt;   // 電量耗盡：緩緩下沉但不強制中斷（承基本版）
    updateAIDrones(dt);

    // 障礙柱碰撞
    if(invulnTObstacle>0) invulnTObstacle-=dt;
    else for(const ob of obstacles){
      const dx=drone.pos.x-ob.position.x, dz=drone.pos.z-ob.position.z;
      if(Math.hypot(dx,dz)<1.5&&Math.abs(drone.pos.y-ob.position.y)<3.5){
        obstacleHits++; invulnTObstacle=1.0; sfx.play('fail');
        drone.vel.addScaledVector(new THREE.Vector3(dx,0,dz).normalize(),4.0);
        hud.toast(`撞到障礙柱！(${obstacleHits})`,'fail');
        break;
      }
    }
    // 無人機擦身
    if(invulnTAI>0) invulnTAI-=dt;
    else for(const ai of aiDrones){
      if(drone.pos.distanceTo(ai.mesh.position)<1.3){
        aiHits++; invulnTAI=1.2; sfx.play('fail');
        hud.toast(`與巡邏機擦身！(${aiHits})`,'fail');
        break;
      }
    }
    // 依序穿環
    const target=checkpoints[checkpointIndex];
    if(target&&checkRingPass(target,drone.pos,prevPos)){
      paintRing(target,0x64748b,0.3);
      checkpointIndex++; sfx.play('ring');
      hud.toast(`檢查點 ${checkpointIndex}/${checkpoints.length}`,'ok');
      if(checkpointIndex>=checkpoints.length){
        finishLevel();
      } else {
        paintRing(checkpoints[checkpointIndex],0x22c55e);
        hud.setOffscreenTarget(checkpoints[checkpointIndex].position);
      }
    }
    guide.update(dt,{checkpointIndex});
  }
  mesh.position.copy(drone.pos);
  mesh.quaternion.copy(drone.q);
  mesh.visible=(rig.mode!=='fpv');
  if(mesh.userData.spin)mesh.userData.spin.rotation.y+=dt*3.2;
  rig.portrait=hud.portrait;
  rig.update(dt,drone,mesh);
  hud.setBattery(battery.pct);
  hud.setTelemetry(drone.pos.y,drone.speed());
  hud.setProgress(engine.simStarted?`檢查點 ${checkpointIndex}/${checkpoints.length}`:'');
  const mapTargets=checkpoints.map((r,i)=>({pos:r.position,done:i<checkpointIndex}));
  hud.drawMinimap(drone.pos,drone.yaw,BOUND,mapTargets,{route:true});
  hud.setAnomaly(drone.anomalyT>0);
  hud.update(dt,engine.camera,drone.pos);
});

showIntro();
addEventListener('beforeunload',()=>engine.dispose());
</script>
</body>
</html>
