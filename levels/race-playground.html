<!-- ============================================================
     race-playground.html — 改裝賽道第 1 條「操場入門」（2026-10-09，第一階段）
     老師定案：像瑪利歐賽車的穿圈賽道；機體用機庫（pages/garage.html）組的；
     第一階段＝計時賽＋幽靈機＋進站換電池＋加速環／充電環。

     · 幽靈機＝自己這條賽道最快的那一次，半透明一起飛
     成績＝3 圈總秒數（越少越好，data/score-rule.js 已列入）。
