<body>
<canvas id="c"></canvas>
<div id="ver">NEWDRONE RESCUE-PK v1.0</div>

<script type="module">
import * as THREE from 'three';
import { Engine } from '../core/engine.js';
import { InputManager } from '../core/input.js';
import { YawDrone, aiMoveWorld } from '../core/systems/yaw-drone.js';
import { renderSplit } from '../core/camera.js';
import { WindSystem } from '../core/systems/wind.js';
import { buildDroneStyle } from '../core/drone-styles.js';
import { sfx } from '../core/audio.js';
import { progress } from '../data/progress.js';
import { getLevel } from '../data/levels-manifest.js';
import { seats as seatSvc } from '../data/seats.js';
import { PkChallenge } from '../core/challenge.js';

/* ============================================================
   情境體驗：搜救對戰（x-rescue 的 pk-live 版本，規劃書 §9 成本表中成本
   第三例：「同場搶找信標，誰找到算誰的｜中｜信標加 claimed-by」）
   ------------------------------------------------------------
   跟 cargo-pk（各送各的，互不干涉）不同、但跟 agri-pk（同田搶噴）
   同一種玩法家族：山區地形只有一份，兩人共用同一組信標（倖存者
   標記），每個信標新增 foundBy 欄位（null|0|1），誰先飛到範圍內
   就永久算誰找到的（不會被對方蓋掉）——這正是成本表註記「信標加
   claimed-by」的實際做法，直接沿用 agri-pk 已驗證過的「一次性認領、
   永久鎖定」模式，不用再發明新的爭奪邏輯。屬於「對稱同任務型」，
   沿用單人版整場難度選單（easy/med/hard 對應信標數/耗電/風力/
   時間），雙方共用同一套規則才公平。

   ⚠️ 關鍵設計決策——移除「熱成像」手動開關（本檔跟單人版最大的
   差異，思路跟 agri-pk 拿掉「開關噴藥」完全一致）：單人版的熱成像
   是「按 B 鍵啟動、限時 15 秒、冷卻 20 秒」的技能型機制，靠
   InputManager.playerFor(ctl) 的按鍵偵測觸發——但讀過 core/input.js
   後已確認鍵盤/觸控席位完全沒有按鍵偵測（只有 gamepad 有），教室
   pk-live 席位又幾乎都是鍵盤，沒辦法逐席偵測這顆開關。
   跟 agri-pk 拿掉「開關噴藥」的判斷邏輯一致：這裡不是簡單拿掉就
   了事，因為熱成像不是「非核心的省藥水技巧」，而是「一般模式偵測
   距離只有 1.5m，熱成像模式可以拉到 4~7m」——沒有它，50×50 公尺的
   山地幾乎找不到信標。**解法：拿掉「一般/熱成像」兩段式狀態機，
   直接把 curCfg.detectR（原本熱成像模式的偵測距離）當成本關唯一、
   恆定的偵測半徑**——這樣同時達成「不需要按鍵偵測」跟「保留單人版
   同一組難度數值所代表的可尋獲性」，是簡化掉「限時/冷卻」的時間
   維度，而不是簡化掉「找得到信標」這件事本身，兩者影響完全不同。
   代價是 PK 版找信標會比單人版容易一些（沒有「大部分時間只有
   1.5m」的低偵測時段），但這對兩位玩家是公平的（雙方都拿到同一個
   恆定偵測半徑），符合對稱同任務型「共用同一套規則」的公平性要求。

   物理／AI：C1 家族（YawDrone），yaw=0 機頭朝 +Z，同步 mesh 時
   mesh.rotation.y=yaw+Math.PI。單人版沒有 AI 角色（信標是靜止
   目標），新寫「找最近未認領信標」的搶信標 AI，沿用 goalkeeper-pk／
   agri-pk 已驗證的 aiMoveWorld()（C1 家族既有工具，不需要另外
   反推安全轉向函式）。

   地形碰撞：沿單人版連續地形高度判定（`terrainH()` 即時算腳下地形
   高度，不是離散障礙物清單），per-player 各自獨立的碰撞冷卻計時，
   彼此不共用（跟 agri-pk 的樹木/電線桿碰撞用同一套「各自獨立」原則）。

   出生點：兩人分別從山地南／北兩端出生（南 z=-20／北 z=+20，跟
   goalkeeper-pk／agri-pk「兩端分列」同一設計精神），信標池
   （ALL_TARGET_XZ）本來就散佈在地圖中央一帶，不特別偏向任何一端，
   不需要像 agri-pk 那樣為了公平性重新設計資源點座標（這關沒有
   補給站，也沒有「單一資源點」需要處理點對稱的問題）。

   電量：沿單人版連續耗電（沒有補給站，耗電速率在時限內通常耗不到
   0%，屬於單人版本來就設計成「輕度資源壓力」而非「硬性淘汰」的
   機制）——但仍比照 agri-pk 的「停飛不停賽」原則：若真的耗盡，該
   玩家停飛，不結束整場比賽。

   相機：C1 家族，沿用 goalkeeper-pk／agri-pk 已驗證的原始 yaw、
   -sinθ,-cosθ 公式，偏移距離放大到適合 50×50 開放山地的量級（比
   agri-pk 的農田又更大），已用 __ndDebug 獨立驗算，並比照 cargo-pk
   教訓用至少 4 秒等待時間讓 lerp 收斂再驗證方向。
   ============================================================ */

const ACT='rescue-pk';
const LEVEL=getLevel(ACT);
const pkc=new PkChallenge(ACT);   // 挑戰條件（席位大廳統一選，雙方相同）
progress.migrateLegacy();

/* ── 席位表：沒有（或筆數不對）就導去大廳指派 ── */
let seatList=seatSvc.get(ACT);
const seatsValid=seatSvc.isValid(seatList,2);
if(!seatsValid) location.href='../pages/pairing.html?activity='+ACT;

function boot(){
const humanIdx=seatList.map((s,i)=>s.controller?.type!=='ai'?i:null).filter(i=>i!==null);
const humanCount=humanIdx.length;
const PLABEL=['P1','P2'];
const TINTS=[0x38bdf8,0xff5533];

/* ── 常數（沿單人版 x-rescue.html 原值：地形公式、信標座標池、物理
   參數、難度數值全部一字不改，只拿掉熱成像的限時/冷卻兩個欄位不用） ── */
const PHYS={GRAVITY:-9.81,HOVER:9.81,THRMAX:16,PITCHMAX:20,YAWMAX:2.6,
  DRAG_PER_SEC:Math.pow(0.88,60),WBOUNCE:0,FBOUNCE:0};
const BOUNDS={minX:-24,maxX:24,minY:-20,maxY:35,minZ:-24,maxZ:24,BR:0};
const DIFF_CFG={
  easy:{label:'🌿 初級',time:180,targetCount:5,detectR:7.0,wind:0,  batDrain:5 },
  med: {label:'⚡ 中級',time:150,targetCount:6,detectR:5.5,wind:0.8,batDrain:9 },
  hard:{label:'💀 高級',time:120,targetCount:8,detectR:4.0,wind:1.8,batDrain:14},
};
const TW=50, TD=50, TSEGS=50;
const ALL_TARGET_XZ=[
  [-8,-6],[6,9],[-4,13],[11,-4],[-13,3],
  [8,-14],[-7,-16],[15,10],[-16,-8],[4,-8],
];
function terrainH(x,z){
  const h=
    3.0*Math.sin(x*0.20)*Math.cos(z*0.17)+
    2.2*Math.sin(x*0.42+0.9)*Math.sin(z*0.38-0.4)+
    1.5*Math.cos(x*0.28+1.3)*Math.sin(z*0.25+0.8)+
    1.0*Math.sin(x*0.60)*Math.cos(z*0.55+0.5)+
    0.5*Math.sin(x*1.10+0.3)*Math.cos(z*0.90-0.7);
  return Math.max(0.1,h+2.0);
}
/* 兩人分列山地南／北兩端出生（跟守門/前鋒、agri-pk 對角出生同一精神） */
const PLAYER_SPAWNS=[new THREE.Vector3(0,terrainH(0,-20)+3,-20), new THREE.Vector3(0,terrainH(0,20)+3,20)];
const SPAWN_YAW=[0,Math.PI];
const AI_SPD={easy:3.0,med:4.5,hard:6.0};

/* ── 引擎與系統 ── */
const lowQ=innerWidth<600;
const engine=new Engine(document.getElementById('c'),{lowQuality:lowQ});
const input=new InputManager();
const wind=new WindSystem();

engine.scene.background=new THREE.Color(0x7ab0d8);
engine.scene.fog=new THREE.Fog(0x7ab0d8,40,100);
const sun=new THREE.DirectionalLight(0xfff5d0,1.1);
sun.position.set(15,30,10); sun.castShadow=true;
sun.shadow.camera.left=sun.shadow.camera.bottom=-40;
sun.shadow.camera.right=sun.shadow.camera.top=40;
sun.shadow.camera.near=0.5; sun.shadow.camera.far=150;
sun.shadow.mapSize.set(2048,2048);

let targets=[], windParticles=null;
function clearDynamicScene(){
  while(engine.scene.children.length>0)engine.scene.remove(engine.scene.children[0]);
  engine.scene.add(sun);
  engine.scene.add(new THREE.AmbientLight(0xffffff,.5));
  engine.scene.add(new THREE.HemisphereLight(0x87ceeb,0x4a7a30,.35));
  targets=[]; windParticles=null;
}
function buildTerrain(){
  const geo=new THREE.PlaneGeometry(TW,TD,TSEGS,TSEGS);
  geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){pos.setY(i,terrainH(pos.getX(i),pos.getZ(i)));}
  geo.computeVertexNormals();
  const tMesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x4a8a3a,roughness:0.9}));
  tMesh.receiveShadow=true; engine.scene.add(tMesh);
}
function addRocks(){
  const rMat=new THREE.MeshStandardMaterial({color:0x888880,roughness:0.95});
  [[-10,10],[8,8],[12,-5],[-5,15],[0,-12],[15,2],[-14,-3],[6,-15],[10,13],[-8,-10]].forEach(([rx,rz])=>{
    const ry=terrainH(rx,rz); if(ry<3)return;
    const sz=0.4+Math.random()*0.8;
    const m=new THREE.Mesh(new THREE.DodecahedronGeometry(sz,0),rMat.clone());
    m.position.set(rx,ry+sz*0.3,rz);
    m.rotation.set(Math.random(),Math.random()*2,Math.random());
    m.castShadow=true; engine.scene.add(m);
  });
}
function addTrees(){
  const trM=new THREE.MeshStandardMaterial({color:0x5a3a1a,roughness:0.9});
  const lfM=new THREE.MeshStandardMaterial({color:0x2d7030,roughness:0.8});
  [[-2,5],[3,7],[7,4],[-6,2],[4,-6],[-9,-5],[1,11],[-3,-9],[9,-8],[-11,7],
   [5,14],[-13,0],[8,-11],[0,3],[-5,9],[12,5],[-8,12],[6,-3],[-1,-14],[11,-2]].forEach(([tx,tz])=>{
    const ty=terrainH(tx,tz); if(ty>5.5)return;
    const h=1.2+Math.random()*0.8;
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.12,h,6),trM.clone());
    trunk.position.set(tx,ty+h/2,tz); trunk.castShadow=true; engine.scene.add(trunk);
    const leaf=new THREE.Mesh(new THREE.ConeGeometry(0.5+Math.random()*0.3,h*0.9,7),lfM.clone());
    leaf.position.set(tx,ty+h+0.3,tz); leaf.castShadow=true; engine.scene.add(leaf);
  });
}
/* 信標視覺：跟單人版一樣的立牌造型，但初始色調用中性琥珀色（未認領），
   認領後才染成 P1／P2 隊色，foundBy 欄位取代單人版的 found 布林值 */
function addTarget(tx,ty,tz){
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.08,12),
    new THREE.MeshStandardMaterial({color:0x2a1a06,roughness:0.95}));
  g.add(base);
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,1.5,6),
    new THREE.MeshStandardMaterial({color:0x1e1206}));
  pole.position.y=0.75; g.add(pole);
  const topMesh=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,6),
    new THREE.MeshStandardMaterial({color:0xffaa00,emissive:0xaa6600,emissiveIntensity:1.2}));
  topMesh.position.y=1.55; g.add(topMesh);
  const pl=new THREE.PointLight(0xffaa00,1.4,10);
  pl.position.y=1.6; g.add(pl);
  const ring=new THREE.Mesh(new THREE.RingGeometry(0.7,0.9,24),
    new THREE.MeshBasicMaterial({color:0xffaa00,side:THREE.DoubleSide,transparent:true,opacity:0.3}));
  ring.rotation.x=-Math.PI/2; ring.position.y=0.05; g.add(ring);
  g.position.set(tx,ty,tz); g.castShadow=true; engine.scene.add(g);
  targets.push({pos:new THREE.Vector3(tx,ty,tz),foundBy:null,mesh:g,ring,light:pl,topMesh});
}
function claimTarget(tgt,i){
  tgt.foundBy=i;
  tgt.topMesh.material.color.setHex(TINTS[i]); tgt.topMesh.material.emissive.setHex(TINTS[i]); tgt.topMesh.material.emissiveIntensity=2.0;
  tgt.light.color.setHex(TINTS[i]); tgt.light.intensity=2.2;
  tgt.ring.material.color.setHex(TINTS[i]); tgt.ring.material.opacity=0.6;
}
function buildWindParticles(){
  const count=60,R=28,positions=new Float32Array(count*3);
  for(let i=0;i<count;i++){positions[i*3]=(Math.random()-.5)*R*2;positions[i*3+1]=Math.random()*20+0.5;positions[i*3+2]=(Math.random()-.5)*R*2;}
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
  const pts=new THREE.Points(geo,new THREE.PointsMaterial({color:0xb0d8ff,size:0.2,transparent:true,opacity:0.5,sizeAttenuation:true}));
  engine.scene.add(pts); return pts;
}
function tickWindParticles(dt){
  if(!windParticles||wind.vec.lengthSq()<0.01)return;
  const pos=windParticles.geometry.attributes.position,R=28;
  for(let i=0;i<pos.count;i++){
    pos.array[i*3]+=wind.vec.x*dt*3.5; pos.array[i*3+1]-=dt*0.2; pos.array[i*3+2]+=wind.vec.z*dt*3.5;
    if(pos.array[i*3]>R)pos.array[i*3]-=R*2; if(pos.array[i*3]<-R)pos.array[i*3]+=R*2;
    if(pos.array[i*3+2]>R)pos.array[i*3+2]-=R*2; if(pos.array[i*3+2]<-R)pos.array[i*3+2]+=R*2;
    if(pos.array[i*3+1]<0.3)pos.array[i*3+1]=Math.random()*20+0.5;
  }
  pos.needsUpdate=true;
}
function buildScene(diff){
  clearDynamicScene(); buildTerrain(); addRocks(); addTrees();
  const cfg=DIFF_CFG[diff];
  ALL_TARGET_XZ.slice(0,cfg.targetCount).forEach(([tx,tz])=>addTarget(tx,terrainH(tx,tz),tz));
  if(cfg.wind>0)windParticles=buildWindParticles();
  engine.scene.add(meshes[0]); engine.scene.add(meshes[1]);
}

/* ── 兩台真機體（C1 家族 YawDrone；機體樣式改用可染色的 trainer-orb——
   單人版固定用「救援機」rescue-search，但其建構函式 m_rescue() 沒有
   吃 tc/color 參數（橘色寫死），PK 版需要清楚隊色識別，沿用
   cargo-pk／agri-pk 的做法：捨棄情境造型、改用泛用可染色機體） ── */
const drones=[0,1].map(i=>new YawDrone({spawn:PLAYER_SPAWNS[i].clone(),yaw:SPAWN_YAW[i],bounds:BOUNDS,phys:PHYS}));
const meshes=[0,1].map(i=>{
  const m=buildDroneStyle('trainer-orb',{tint:TINTS[i],scale:1});
  m.castShadow=true; return m;
});

/* ── 分割畫面：C1 家族，沿用 goalkeeper-pk／agri-pk 已驗證的原始 yaw、
   -sinθ,-cosθ 公式，偏移距離放大到適合 50×50 開放山地的量級（比
   agri-pk 農田再大一些）。仍會用 __ndDebug 獨立驗算一次。 ── */
const cams=[new THREE.PerspectiveCamera(60,1,0.05,120),new THREE.PerspectiveCamera(60,1,0.05,120)];
const _v=new THREE.Vector3();
function updatePaneCam(cam,d){
  const {x,y,z}=d.pos;
  const sy=Math.sin(d.yaw), cy=Math.cos(d.yaw);
  cam.position.lerp(_v.set(x-sy*6.5,y+3.0,z-cy*6.5),.09);
  cam.lookAt(x,y+0.3,z);
}
engine.setRenderFn((renderer,scene)=>{
  renderSplit(renderer,scene,[
    {camera:cams[0],rect:{x:0,y:0,w:0.5,h:1}},
    {camera:cams[1],rect:{x:0.5,y:0,w:0.5,h:1}},
  ]);
});
function seatDeviceIcon(ctl){
  return ctl?.type==='gamepad'?'🎮':ctl?.type==='keyboard'?('⌨️'+(ctl.layout||'')):ctl?.type==='touch'?'📱':'🤖';
}
function renderPaneLabels(){
  const wrap=document.getElementById('pane-labels');
  wrap.innerHTML=[0,1].map(i=>
    `<div class="plabel" style="left:${i*50}%">${PLABEL[i]} ${seatDeviceIcon(seatList[i].controller)}</div>`).join('');
}
renderPaneLabels();

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.opacity=1;
  clearTimeout(toast._t); toast._t=setTimeout(()=>{el.style.opacity=0;},1300);
}

/* ── 賽局狀態：P[0]/P[1] 各自獨立的資源／狀態，共用同一份信標池
   （target.foundBy 決定歸屬，不是各自一份） ── */
let pDiff='easy', curCfg=DIFF_CFG.easy;
let timer=180, totalTime=180, playing=false, finished=false;
function freshP(){ return {battery:100,outOfPower:false,collisions:0,lastCollisionT:-2,nearestDist:Infinity}; }
const P=[freshP(),freshP()];
const foundCount=[0,0];

function startBuildScene(diff){
  curCfg=DIFF_CFG[diff];
  foundCount[0]=0; foundCount[1]=0;
  buildScene(diff);
  wind.randomize(curCfg.wind);
}

/* ── 地形碰撞（連續地形高度判定，沿單人版 checkTerrainCollision，
   per-player 各自獨立冷卻計時） ── */
function checkTerrainCollision(i){
  const d=drones[i], p=P[i];
  const th=terrainH(d.pos.x,d.pos.z);
  if(d.pos.y<th+0.2){
    d.pos.y=th+0.2;
    d.vel.y=Math.max(0,d.vel.y*-0.2);
    const now=performance.now()/1000;
    if(now-p.lastCollisionT>1.5){
      p.lastCollisionT=now; p.collisions++;
      toast(`💥 ${PLABEL[i]} 地形碰撞！`); sfx.play('fail');
    }
  }
}

/* ── 搜救偵測（距離內一次性尋獲，沿單人版邏輯；detectR 固定當恆定
   偵測半徑使用——不再有一般/熱成像兩段式狀態，見檔頭決策說明。
   同場搶信標：target.foundBy 一旦被任一方認領就永久鎖定） ── */
function checkRescue(i){
  const d=drones[i], p=P[i];
  if(p.outOfPower)return;
  p.nearestDist=Infinity;
  targets.forEach(tgt=>{
    if(tgt.foundBy!=null)return;
    const dist=d.pos.distanceTo(tgt.pos);
    if(dist<p.nearestDist)p.nearestDist=dist;
    if(dist<curCfg.detectR){
      claimTarget(tgt,i); foundCount[i]++;
      toast(`✅ ${PLABEL[i]} 尋獲倖存者！`); sfx.play('ring');
    }
  });
  if(foundCount[0]+foundCount[1]>=curCfg.targetCount)finishGame();
}

/* ── 資源系統（沿單人版連續耗電，這關沒有補給站；電量歸零＝該玩家
   停飛，不結束整場比賽——比照 agri-pk 的「停飛不停賽」原則） ── */
function tickResources(i,dt){
  const p=P[i];
  if(p.outOfPower)return;
  p.battery=Math.max(0,p.battery-curCfg.batDrain*dt/60);
  if(p.battery<=0&&!p.outOfPower){
    p.outOfPower=true;
    toast(`⚠️ ${PLABEL[i]} 電量耗盡，已停飛！`); sfx.play('warn');
  }
}

/* ── 目標閃爍動畫（沿單人版低強度脈動，沒有熱成像兩段式差異——已認領
   的信標不再閃爍，維持穩定隊色即可） ── */
function animateTargets(t){
  targets.forEach(tgt=>{
    if(tgt.foundBy!=null)return;
    const pulse=0.5+0.5*Math.sin(t*3.0);
    tgt.ring.material.opacity=0.2+pulse*0.25; tgt.ring.scale.setScalar(1+pulse*0.1);
  });
}

/* ── AI 席位：搶信標（單人版沒有這個角色，新寫的最近未認領信標導航，
   走 aiMoveWorld——C1 家族既有工具，goalkeeper-pk／agri-pk 已驗證過
   這條路可行，不需要另外反推安全轉向函式） ── */
function nearestUnclaimedTarget(i){
  const d=drones[i]; let best=null, bestD2=Infinity;
  targets.forEach(tgt=>{
    if(tgt.foundBy!=null)return;
    const dx=tgt.pos.x-d.pos.x, dz=tgt.pos.z-d.pos.z, d2=dx*dx+dz*dz;
    if(d2<bestD2){bestD2=d2;best=tgt;}
  });
  return best;
}
function updateRescueAI(i,dt,diff){
  const d=drones[i], p=P[i];
  if(p.outOfPower)return;
  const spd=AI_SPD[diff]??AI_SPD.med;
  const tgt=nearestUnclaimedTarget(i);
  const dest=tgt?new THREE.Vector3(tgt.pos.x,tgt.pos.y+1.5,tgt.pos.z):PLAYER_SPAWNS[i];
  aiMoveWorld(d,dest,dt,spd,BOUNDS,PHYS);
}

/* ── Intro／暫停／結算 ── */
function seatDesc(){
  return [0,1].map(i=>{
    const c=seatList[i].controller;
    const who=c?.type==='ai'?`AI（${({easy:'簡單',med:'中等',hard:'困難'})[c.diff||'med']}）`:
      c?.type==='gamepad'?`手把[${c.gpIndex}]`:c?.type==='keyboard'?`鍵盤${c.layout}`:'觸控';
    return `${PLABEL[i]}：${who}`;
  }).join('　');
}
function showModal({title,html,buttons}){
  closeModal();
  const wrap=document.createElement('div');
  wrap.className='nd-modal';
  wrap.style.cssText='position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(6,8,10,.55);';
  wrap.innerHTML=`<div style="background:rgba(20,26,30,.95);border:1px solid rgba(255,200,80,.4);
    border-radius:14px;padding:22px 26px;max-width:520px;color:#f0ecd8;font-size:13px;line-height:1.6;">
    <h2 style="margin:0 0 10px;font-size:18px;color:#facc15;">${title}</h2>
    ${html}
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;"></div></div>`;
  const btnWrap=wrap.querySelector('div > div:last-child');
  buttons.forEach(b=>{
    const el=document.createElement('button');
    el.id=b.id; el.textContent=b.label;
    el.style.cssText='background:rgba(250,204,21,.15);border:1px solid rgba(250,204,21,.5);color:#facc15;border-radius:8px;padding:8px 14px;font-size:12.5px;cursor:pointer;font-family:inherit;';
    el.onclick=b.onClick;
    btnWrap.appendChild(el);
  });
  document.body.appendChild(wrap);
}
function closeModal(){ document.querySelectorAll('.nd-modal').forEach(el=>el.remove()); }

function showIntro(){
  engine.simStarted=false; playing=false;
  showModal({title:'情境體驗 · 搜救對戰',
    html:`<p>山難發生！P1／P2 在同一片山區搶搜同一組倖存者信標，飛到
      <strong>偵測範圍內</strong>即可尋獲，先找到的算誰的（不會被對方
      搶走），時間到或信標全部尋獲，比誰找得多！</p>
      <p>⚠️ 注意避開地形碰撞！電量持續消耗，歸零該玩家會停飛
      （比賽不會因此結束）。</p>
      <p style="font-size:11px;color:#c9b389">${seatDesc()}</p>${pkc.introHtml()}`,
    buttons:[
      {id:'b-easy',label:'🌿 初級（5人・3分・偵測7m）',onClick:()=>startGame('easy')},
      {id:'b-med', label:'⚡ 中級（6人・2:30・偵測5.5m）',onClick:()=>startGame('med')},
      {id:'b-hard',label:'💀 高級（8人・2分・偵測4m・強風）',onClick:()=>startGame('hard')},
      {id:'b-pairing',label:'重新指派席位',onClick:()=>location.href='../pages/pairing.html?activity='+ACT},
    ]});
}
function startGame(diff){
  pDiff=diff;
  timer=DIFF_CFG[diff].time; totalTime=timer;
  P[0]=freshP(); P[1]=freshP();
  drones.forEach((d,i)=>d.reset(PLAYER_SPAWNS[i].clone(),SPAWN_YAW[i]));
  startBuildScene(diff);
  closeModal(); sfx.play('click');
  pkc.apply(drones,seatList);
  engine.simStarted=true; playing=true; finished=false;
  toast('開始搜救對戰！');
}
function togglePause(){
  if(!playing||finished)return;
  engine.paused=!engine.paused;
  if(engine.paused)showPauseModal(); else closeModal();
}
function showPauseModal(){
  showModal({title:'暫停',
    html:`<p>難度：${DIFF_CFG[pDiff].label}　剩餘 ${Math.max(0,timer).toFixed(0)} 秒</p>
      <p>P1 找到 ${foundCount[0]} 人　P2 找到 ${foundCount[1]} 人　（共 ${curCfg.targetCount} 人）</p>`,
    buttons:[
      {id:'b-resume',label:'繼續',onClick:togglePause},
      {id:'b-audio',label:'音效：'+(sfx.enabled?'開':'關'),
        onClick:()=>{sfx.toggle();sfx.play('click');showPauseModal();}},
      {id:'b-restart',label:'重來',onClick:()=>location.reload()},
    ]});
}
function finishGame(){
  if(finished)return;
  finished=true; playing=false; sfx.play('finish');
  const winner=foundCount[0]>foundCount[1]?'P1':foundCount[1]>foundCount[0]?'P2':'tie';
  progress.record(ACT,{completed:true,score:Math.max(foundCount[0],foundCount[1]),
    ...pkc.recordFields(),metrics:{p1Found:foundCount[0],p2Found:foundCount[1],totalTargets:curCfg.targetCount,winner,humanCount,diff:pDiff}});
  const resText=winner==='tie'?'🤝 平局':`🏆 ${winner} 獲勝！`;
  showModal({title:'挑戰結束 · '+resText,
    html:`<p>P1：<b>${foundCount[0]} 人</b>（地形碰撞 ${P[0].collisions} 次）<br>
      P2：<b>${foundCount[1]} 人</b>（地形碰撞 ${P[1].collisions} 次）<br>
      共尋獲 ${foundCount[0]+foundCount[1]}/${curCfg.targetCount} 人</p>
      <p>成績已記錄（nd.progress['${ACT}']）。</p>`,
    buttons:[
      {id:'b-retry',label:'再玩一次',onClick:()=>startGame(pDiff)},
      {id:'b-diff',label:'換難度',onClick:()=>showIntro()},
      {id:'b-pairing',label:'重新指派席位',onClick:()=>location.href='../pages/pairing.html?activity='+ACT},
      {id:'b-back',label:'返回入口',onClick:()=>location.href='../index.html'},
    ]});
}

addEventListener('keydown',e=>{ if(e.code==='Escape')togglePause(); });

/* ── 主迴圈 ── */
engine.start((dt,simStarted)=>{
  input.update(dt);
  if(engine.paused)return;
  pkc.update(dt);

  if(playing&&!finished){
    wind.update(dt);
    [0,1].forEach(i=>{
      const d=drones[i], p=P[i];
      if(!p.outOfPower){
        if(seatList[i].controller?.type==='ai'){
          updateRescueAI(i,dt,seatList[i].controller.diff||'med');
        }else{
          const ip=input.playerFor(seatList[i].controller);
          d.step(dt,ip);
        }
        if(wind.enabled)d.vel.addScaledVector(wind.vec,dt*4.0);
      }
      checkTerrainCollision(i);
      checkRescue(i);
      tickResources(i,dt);
    });
    tickWindParticles(dt);
    animateTargets(performance.now()/1000);

    timer-=dt;
    if(timer<=0&&!finished){timer=0;finishGame();}
  }

  drones.forEach((d,i)=>{
    meshes[i].position.copy(d.pos);
    meshes[i].rotation.y=d.yaw+Math.PI; // 補償 yaw-drone 與 drone-styles 機頭慣例相反
  });
  cams.forEach((cam,i)=>updatePaneCam(cam,drones[i]));

  const distTxt=v=>(v===Infinity?'－':v.toFixed(0)+'m');
  document.getElementById('topbar-text').innerHTML=
    `<span class="p1">P1 <b>${foundCount[0]}</b> 📡${distTxt(P[0].nearestDist)} 🔋${Math.round(P[0].battery)}%</span>`+
    `<span>${pkc.topTag()}${DIFF_CFG[pDiff].label}　尋獲${foundCount[0]+foundCount[1]}/${curCfg.targetCount}　剩${Math.max(0,Math.ceil(timer))}秒</span>`+
    `<span class="p2">P2 <b>${foundCount[1]}</b> 📡${distTxt(P[1].nearestDist)} 🔋${Math.round(P[1].battery)}%</span>`;
});

startBuildScene('easy'); // intro 畫面預覽用的預設場景，startGame() 會依選擇的難度重建
showIntro();
addEventListener('beforeunload',()=>engine.dispose());
} // boot()
if(seatsValid) boot();
</script>
