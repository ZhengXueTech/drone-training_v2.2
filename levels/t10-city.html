<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27><text y=%2713%27 font-size=%2713%27>🏙️</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>第十關 城市峽谷｜newdrone T10</title>
<script type="importmap">
{ "imports": { "three": "../vendor/three-0.184.0/three.module.min.js" } }
</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f19;
    font-family:'Share Tech Mono','Consolas',monospace;}
  #c{width:100%;height:100%;display:block;touch-action:none;}
  body.nd-portrait #c{height:60%;}
  #ver{position:fixed;left:10px;bottom:4px;font-size:10px;color:#3b5c7a;z-index:21;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ver">NEWDRONE T10 CITY v1.0</div>
<script type="module">
import * as THREE from 'three';
import { Engine } from '../core/engine.js';
import { InputManager } from '../core/input.js';
import { Drone } from '../core/physics.js';
import { CameraRig, CAM_LABELS } from '../core/camera.js';
import { HUD, DENSITY_LABELS } from '../core/hud.js';
import { UI } from '../core/ui.js';
import { Challenge } from '../core/challenge.js';   // 2026-10-01 挑戰條件
import { Guide } from '../core/guide.js';
import { buildBasicField } from '../core/world.js';
import { buildDroneStyle, droneStyleGet, droneStyleSet, DRONE_STYLES } from '../core/drone-styles.js';
import { BatterySystem } from '../core/systems/battery.js';
import { sfx } from '../core/audio.js';
import { progress } from '../data/progress.js';
import { getLevel } from '../data/levels-manifest.js';

const LEVEL=getLevel('t10');
progress.migrateLegacy();

/* ── 城市峽谷：跟 t05/t07/t08/t09 一樣沿用 sandbox 的「連續課程」結構——
   在密集建築群的狹窄廊道間依序飛到 6 個航點，本關是「最考驗操控精準度的
   場景」（承基本版原話），跟 t09 的「觀察節奏」不同，這關考的是「精準
   穿梭、不要擦到牆」。沒有分階段場景重建，Guide 只顯示一行提示文字。 ── */
const lowQ=innerWidth<600;
const engine=new Engine(document.getElementById('c'),{lowQuality:lowQ});
const input=new InputManager();
const ch=new Challenge({levelId:'t10',input});   // 挑戰條件（須先於 HUD：決定是否建立風場面板）
const hud=new HUD(ch.hudFeatures(LEVEL.hud));
const ui=new UI(input);
ch.ui=ui; ch.setHud(hud);
const rig=new CameraRig(engine.camera,{pilotPositions:[
  new THREE.Vector3(20,10,12), new THREE.Vector3(-20,10,12), new THREE.Vector3(0,10,25)]});
/* 最遠航點 z=-44，留 6 裕度 → BOUND=50（沿用 t04-t09 教訓）。 */
const BOUND=50, HOVER_Y=5.0;
buildBasicField(engine.scene,{size:BOUND,sky:0x0b0f19});

/* ── 機體（樣式可在開場畫面切換，見 showIntro 的 b-style 按鈕）── */
const teamTint=progress.setting('teamTint',0x3399ff);
let styleIdx=Math.max(0,DRONE_STYLES.findIndex(s=>s.code===(droneStyleGet()||'trainer-orb')));
let mesh=null;
function rebuildMesh(){
  if(mesh)engine.scene.remove(mesh);
  mesh=buildDroneStyle(DRONE_STYLES[styleIdx].code,{tint:teamTint});
  mesh.castShadow=true;
  engine.scene.add(mesh);
}
rebuildMesh();

const SPAWN=new THREE.Vector3(0,1.5,5);   // 地面出生，同 t04/t05/t08/t09
const drone=new Drone({mode:'arcade',bounds:{x:BOUND,z:BOUND,y:20},spawn:SPAWN});

/* ── 建築群（忠實移植自基本版 stage10 的座標與尺寸：[x,z,寬,深,高]）。
   world.js 沒有現成的「建築方塊」原型，直接用 BoxGeometry＋AABB 碰撞，
   關卡本地維護——跟 t09 的移動障礙一樣，目前只有這關需要，不到抽成
   core 模組的程度。AABB 膨脹 0.6m 沿用基本版數值，這關的核心教學目的
   就是「精準穿梭」，判定刻意不額外放寬（跟 t09 同樣的例外考量：寬鬆
   優先守則不適用於「精準操控」是核心考驗的關卡）。 ── */
const BUILDINGS=[
  [-8,-8,4,4,14],  [-8,-18,4,4,18], [-8,-28,4,4,12], [-8,-38,4,4,16],
  [8,-8,4,4,16],   [8,-18,4,4,12],  [8,-28,4,4,18],  [8,-38,4,4,14],
  [-3,-14,3,3,10], [3,-22,3,3,11],  [-3,-32,3,3,9],  [3,-40,3,3,13],
  [-5,-3,2,6,8],   [5,-3,2,6,8],
];
const buildingColors=[0x1e1b4b,0x1a1a3e,0x16163a,0x1c1c42];
const windowEmissives=[0x4338ca,0x3730a3,0x5b21b6,0x4c1d95];
const buildingAABBs=[];
BUILDINGS.forEach(([bx,bz,bw,bd,bh],i)=>{
  const mat=new THREE.MeshStandardMaterial({color:buildingColors[i%4],
    emissive:windowEmissives[i%4],emissiveIntensity:.12,roughness:.7,metalness:.3});
  const m=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd),mat);
  m.position.set(bx,bh/2,bz); m.castShadow=!lowQ;
  engine.scene.add(m);
  const topMat=new THREE.MeshStandardMaterial({color:0xa78bfa,emissive:0xa78bfa,emissiveIntensity:.8});
  const top=new THREE.Mesh(new THREE.BoxGeometry(bw+.1,.15,bd+.1),topMat);
  top.position.set(bx,bh+.08,bz); engine.scene.add(top);
  buildingAABBs.push({minX:bx-bw/2-.6,maxX:bx+bw/2+.6,minZ:bz-bd/2-.6,maxZ:bz+bd/2+.6,minY:0,maxY:bh+.5});
});
let invulnTBuilding=0, buildingHits=0;

/* ── 6 個航點（紫色光球，全向距離判定——不是穿環，因為在狹窄廊道裡從
   任何方向抵達都該算數，跟其他關卡用 makeRing+checkRingPass 的「穿越」
   語意不同，world.js 也沒有現成的光球原型，直接沿用基本版視覺自建） ── */
const WAYPOINT_POS=[
  new THREE.Vector3(0,HOVER_Y,-6),
  new THREE.Vector3(-5,HOVER_Y,-13),
  new THREE.Vector3(0,HOVER_Y,-20),
  new THREE.Vector3(5,HOVER_Y,-27),
  new THREE.Vector3(0,HOVER_Y,-34),
  new THREE.Vector3(0,HOVER_Y,-44),
];
const waypoints=WAYPOINT_POS.map((p,i)=>{
  const m=new THREE.Mesh(new THREE.SphereGeometry(.8,16,16),
    new THREE.MeshStandardMaterial({color:i===0?0x8b5cf6:0x4b5563,
      emissive:i===0?0x8b5cf6:0x4b5563,emissiveIntensity:i===0?1.6:.3,
      transparent:true,opacity:.85}));
  m.position.copy(p); engine.scene.add(m); return m;
});
function paintWaypoint(m,active){
  const hex=active?0x8b5cf6:0x4b5563;
  m.material.color.setHex(hex); m.material.emissive.setHex(hex);
  m.material.emissiveIntensity=active?1.6:.3;
}
let waypointIndex=0;

/* ── 充電站＋電池（沿用 BatterySystem，跟 t04/t05/t09 一致的單站用法） ── */
const chargerPos=new THREE.Vector3(0,0.3,-24);
const charger=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.4,0.4,20),
  new THREE.MeshStandardMaterial({color:0x1e293b,emissive:0xeab308,emissiveIntensity:.6,metalness:.7}));
charger.position.copy(chargerPos); engine.scene.add(charger);
const battery=new BatterySystem({start:100,drainPerSec:1.3,chargers:[{pos:chargerPos,radius:2.6,rate:28}]});

/* ── 引導（單步驟，HUD 文字用） ── */
const guide=new Guide([
  { text:'依序飛到 6 個紫色航點，精準穿梭別擦到建築物', done:s=>s.waypointIndex>=waypoints.length },
],hud,engine.scene);

let flightTime=0, finished=false;

/* ── 視角／蹲姿 ── */
function cycleCam(){ hud.toast('視角：'+CAM_LABELS[rig.cycleMode()],'ok'); syncModes(); }
function syncModes(){ hud.setModes(({arcade:'街機',angle:'角度',pro:'專業'})[drone.mode],CAM_LABELS[rig.mode]); }
addEventListener('keydown',e=>{
  if(e.code==='KeyC')cycleCam();
  if(e.code==='KeyV'){rig.cyclePilot();
    if(rig.mode==='ground')hud.toast(`飛手站位 ${rig.pilotIdx+1}/${rig.pilotPositions.length}`,'ok');}
  if(e.code==='KeyZ')rig.crouch=true;
  if(e.code==='Escape')togglePause();
});
addEventListener('keyup',e=>{ if(e.code==='KeyZ')rig.crouch=false; });
hud.onCamButton(cycleCam);
hud.onPauseButton(togglePause);
hud.attachTouch(input);

/* ── Intro／暫停／結算 ── */
function showIntro(focusIdx=(ch.any?2:1)){
  engine.simStarted=false;
  ui.showModal({
    title:'城市峽谷',
    html:`<p>🏙️ 歡迎進入城市環境飛行訓練——最考驗操控精準度的場景。</p>
      <p>密集的建築群之間只有<b>狹窄廊道</b>，你必須精準地穿梭其中，不能擦到任何牆面。</p>
      <p>🟣 依序到達 6 個紫色光球航點<br>
      🏢 擦到建築物計入碰撞次數（並被彈開）<br>
      🔋 電量正常消耗，地圖中央有充電站</p>
      <p>⚠️ 建議按 C 切換到 FPV 視角，更容易判斷廊道寬度</p>`,
    buttons:[
      {id:'b-style',label:'機體樣式：'+DRONE_STYLES[styleIdx].name,
        onClick:()=>{styleIdx=(styleIdx+1)%DRONE_STYLES.length;
          droneStyleSet(DRONE_STYLES[styleIdx].code);rebuildMesh();showIntro(0);}},
      ch.introButton(()=>showIntro(1)),
      {id:'b-go',label:'🏙️ 進入城市峽谷',onClick:startGame}].filter(Boolean),align:'top'});
  ui.gpSetFocus(['b-style',...(ch.any?['b-challenge']:[]),'b-go'],focusIdx);
}
function startGame(){
  ui.closeModal(); sfx.play('click');
  engine.simStarted=true;
  ch.apply(drone); syncModes(); hud.showAttitude(drone.mode!=='arcade');
  guide.start();
  hud.setOffscreenTarget(waypoints[0].position);
  hud.toast('起飛！注意廊道寬度','ok');
}
function togglePause(){
  if(!engine.simStarted||finished)return;
  engine.paused=!engine.paused;
  if(engine.paused)showPauseModal(); else ui.closeModal();
}
function showPauseModal(){
  ui.showModal({title:'暫停',
    html:`<p>任務：${LEVEL.title}</p><p>已抵達 ${waypointIndex}/${waypoints.length}・已飛行 ${flightTime.toFixed(0)} 秒</p>`,
    buttons:[
      {id:'b-resume',label:'繼續',onClick:togglePause},
      {id:'b-density',label:'HUD：'+DENSITY_LABELS[hud.density],
        onClick:()=>{hud.cycleDensity();showPauseModal();}},
      {id:'b-audio',label:'音效：'+(sfx.enabled?'開':'關'),
        onClick:()=>{sfx.toggle();sfx.play('click');showPauseModal();}},
      {id:'b-restart',label:'重來',onClick:()=>location.reload()},
    ]});
}
function finishLevel(){
  if(finished)return;
  finished=true; sfx.play('finish');
  hud.setOffscreenTarget(null); hud.setGuide(null);
  const finalBattery=Math.round(battery.pct);
  /* 精準度分數：直接沿用基本版公式，擦牆扣分較重（12分/次），呼應
     「精準操控」是這關的核心考驗 */
  const score=Math.round(THREE.MathUtils.clamp(100-buildingHits*12,0,100));
  progress.record('t10',{completed:true,score,
    metrics:{flightTime:Math.round(flightTime),buildingHits,precisionScore:score,finalBattery},...ch.recordFields()});
  ui.showModal({title:'🏙️ 城市峽谷 完成！',
    html:`<p>⏱ 飛行時間：${flightTime.toFixed(1)} 秒　📊 飛行精準度：${score}/100</p>
      <p>🏢 建築物碰撞：${buildingHits} 次　🔋 完賽電量：${finalBattery}%</p>
      <p>零碰撞代表你已具備城市環境精準飛行能力。成績已記錄（nd.progress.t10）。</p>`,
    buttons:[
      {id:'b-retry',label:'再挑戰',onClick:()=>location.reload()},
      {id:'b-back',label:'返回入口',onClick:()=>location.href='../index.html'},
    ]});
}

/* ── HUD 初始 ── */
hud.setMission('城市峽谷：精準穿梭・依序抵達航點');
hud.showAttitude(false);
syncModes();

/* ── 測試/除錯 hook ── */
window.ndDebug=()=>({waypointIndex,total:waypoints.length,buildingHits,
  batteryPct:battery.pct,dronePos:drone.pos.clone(),flightTime,finished});
window.ndTest={
  forceFinish:()=>{ waypointIndex=waypoints.length; finishLevel(); },
  /* warp 到「航點前方一小段」而非直接判定成功，讓接下來一小段真實飛行
     仍要真的觸發距離判定——同系列 warp 慣例的用意 */
  warpBeforeWaypoint:(i)=>{
    const w=waypoints[i]; if(!w)return false;
    drone.pos.set(w.position.x,w.position.y,w.position.z+3);
    drone.vel.set(0,0,0);
    for(let k=0;k<i;k++)paintWaypoint(waypoints[k],false);
    waypointIndex=i;
    paintWaypoint(waypoints[i],true);
    hud.setOffscreenTarget(waypoints[i].position);
    return true;
  }
};

/* ── 主迴圈 ── */
engine.start((dt,simStarted)=>{
  input.update(dt); ui.update(dt);
  if(engine.paused)return;
  const p=input.player(0);
  hud.setGpBar(p.device);
  if(p.device==='gamepad'){
    const camE=p.fnEdge('camCycle'), pilotE=p.fnEdge('pilotCycle');
    rig.crouch=p.btn('crouch');
    if(simStarted&&!ui.modalOpen){
      if(camE)cycleCam();
      if(pilotE){rig.cyclePilot();
        if(rig.mode==='ground')hud.toast(`飛手站位 ${rig.pilotIdx+1}/${rig.pilotPositions.length}`,'ok');}
    }
  }
  if(simStarted&&!finished){
    flightTime+=dt;
    ch.update(dt,drone,engine.camera);
    drone.update(dt,p);
    battery.update(dt,drone.pos,true);
    if(battery.empty) drone.vel.y-=5.9*dt;   // 電量耗盡：緩緩下沉但不強制中斷（承基本版）

    // 建築物 AABB 碰撞
    if(invulnTBuilding>0) invulnTBuilding-=dt;
    else for(const b of buildingAABBs){
      const inX=drone.pos.x>b.minX&&drone.pos.x<b.maxX;
      const inZ=drone.pos.z>b.minZ&&drone.pos.z<b.maxZ;
      const inY=drone.pos.y>b.minY&&drone.pos.y<b.maxY;
      if(inX&&inZ&&inY){
        buildingHits++; invulnTBuilding=0.8; sfx.play('fail');
        const pushX=drone.pos.x>(b.minX+b.maxX)/2?1:-1;
        const pushZ=drone.pos.z>(b.minZ+b.maxZ)/2?1:-1;
        drone.vel.add(new THREE.Vector3(pushX*4,1,pushZ*4));
        hud.toast(`擦到建築物！(${buildingHits})`,'fail');
        break;
      }
    }

    // 航點判定（全向距離，非穿環）
    const target=waypoints[waypointIndex];
    if(target&&drone.pos.distanceTo(target.position)<1.8){
      paintWaypoint(target,false);
      waypointIndex++; sfx.play('ring');
      hud.toast(`航點 ${waypointIndex}/${waypoints.length}`,'ok');
      if(waypointIndex>=waypoints.length){
        finishLevel();
      } else {
        paintWaypoint(waypoints[waypointIndex],true);
        hud.setOffscreenTarget(waypoints[waypointIndex].position);
      }
    }
    guide.update(dt,{waypointIndex});
  }
  mesh.position.copy(drone.pos);
  mesh.quaternion.copy(drone.q);
  mesh.visible=(rig.mode!=='fpv');
  if(mesh.userData.spin)mesh.userData.spin.rotation.y+=dt*3.2;
  rig.portrait=hud.portrait;
  rig.update(dt,drone,mesh);
  hud.setBattery(battery.pct);
  hud.setTelemetry(drone.pos.y,drone.speed());
  hud.setProgress(engine.simStarted?`航點 ${waypointIndex}/${waypoints.length}`:'');
  const mapTargets=waypoints.map((w,i)=>({pos:w.position,done:i<waypointIndex}));
  hud.drawMinimap(drone.pos,drone.yaw,BOUND,mapTargets,{route:true});
  hud.setAnomaly(drone.anomalyT>0);
  hud.update(dt,engine.camera,drone.pos);
});

showIntro();
addEventListener('beforeunload',()=>engine.dispose());
</script>
</body>
</html>
