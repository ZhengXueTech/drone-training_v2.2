<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🚁</text></svg>">
<title>newdrone｜情境體驗（單人）</title>
<style>
  body{margin:0;background:#0a0f1a;color:#cfefff;font-family:'Share Tech Mono','Consolas',monospace;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px;box-sizing:border-box;}
  .back{align-self:flex-start;max-width:820px;width:100%;margin:0 auto 14px;}
  .back a{color:#7aa3b8;text-decoration:none;font-size:12px;}
  .back a:hover{color:#00eeff;}
  h1{font-size:24px;color:#00eeff;letter-spacing:3px;margin:0;}
  p.sub{font-size:12px;color:#7aa3b8;margin:6px 0 20px;text-align:center;max-width:600px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;width:100%;max-width:820px;}
  a.card{display:block;background:#0b1626;border:1px solid rgba(0,238,255,.4);border-radius:12px;
    padding:18px 20px;color:#cfefff;text-decoration:none;transition:.15s;position:relative;}
  a.card:hover{background:#0e2238;box-shadow:0 0 24px rgba(0,238,255,.15);}
  a.card h2{margin:0 0 6px;font-size:16px;color:#00eeff;}
  a.card p{margin:0;font-size:12px;color:#9fc3d8;line-height:1.6;}
  .tag{font-size:10px;color:#facc15;}
  .badge{position:absolute;top:14px;right:16px;font-size:10px;padding:2px 8px;border-radius:999px;}
  .badge.done{background:rgba(74,222,128,.15);color:#4ade80;border:1px solid rgba(74,222,128,.5);}
  a.card.locked{opacity:.45;pointer-events:none;filter:grayscale(.6);}
  .badge.locked{background:rgba(148,163,184,.15);color:#94a3b8;border:1px solid rgba(148,163,184,.4);}
  footer{margin-top:auto;padding-top:30px;font-size:11px;color:#3b5c7a;text-align:center;line-height:1.8;}
</style>
</head>
<body>
<div class="back"><a href="../index.html">← 回首頁</a></div>
<h1>🚁 情境體驗（單人）</h1>
<p class="sub">投遞、農噴、巡檢、搜救等真實情境化單人訓練</p>
<div class="grid" id="grid-levels"></div>
<footer>
  需以本機伺服器開啟（雙擊「啟動模擬器.bat」或 python -m http.server）——ES Modules 不支援 file:// 直開。
</footer>
<script type="module">
import { LEVELS } from '../data/levels-manifest.js';
import { progress } from '../data/progress.js';
import { CATEGORIES } from '../data/level-categories.js';
import { renderLevelGrid } from './levels-page-common.js';
progress.migrateLegacy();

const cat=CATEGORIES.find(c=>c.key==='scenario');
const levels=LEVELS.filter(cat.match);
renderLevelGrid(document.getElementById('grid-levels'), levels, LEVELS, progress);
</script>
<script type="module" src="../core/gp-nav-boot.js"></script>   <!-- 2026-10-06 選單可用搖桿操作（有接搖桿才載入） -->
</body>
</html>
